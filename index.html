<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份证查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        input[type="text"] {
            text-align: center;
            letter-spacing: 2px;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .preview {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            font-family: monospace;
        }
        .preview strong {
            color: #667eea;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .apply-btn {
            margin-top: 10px;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
        }
        .apply-btn:hover:not(:disabled) {
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .result.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .result.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .result.loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1565c0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hint {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
        .disclaimer {
            margin-top: 25px;
            padding: 15px;
            background: #fff3e0;
            border: 1px solid #ffcc80;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: #e65100;
        }
        .disclaimer p {
            margin: 4px 0;
            line-height: 1.5;
        }
        .disclaimer strong {
            color: #bf360c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>贵州移动下卡查询</h1>
        <p class="subtitle">输入6位数字，自动补全为18位身份证号</p>
        
        <div class="input-group">
            <label for="shortId">请输入6位地区码或18位身份证号</label>
            <input type="text" id="shortId" maxlength="18" placeholder="511602 或 511602000000000000" autocomplete="off">
        </div>
        
        <div class="input-group">
            <label for="suitId">选择套餐</label>
            <select id="suitId">
                <option value="19747">小黔卡39元档 (19747)</option>
                <option value="19727">小黔卡49元档 (19727)</option>
                <option value="20069">AI家嘉享礼包169元 (20069)</option>
                <option value="20068">AI家嘉享礼包99元 (20068)</option>
                <option value="20047">AI家嘉享礼包79元 (20047)</option>
            </select>
        </div>
        
        <div class="preview">
            查询号码：<strong id="fullId">-</strong>
        </div>
        
        <button id="queryBtn" onclick="query()">查询</button>
        
        <button id="applyBtn" onclick="goApply()" class="apply-btn">去下卡</button>
        
        <div id="result" class="result"></div>
        
        <p class="hint">提示：输入6位地区码自动补0，或直接输入18位完整身份证号</p>
        
        <div class="disclaimer">
            <p><strong>免责声明</strong></p>
            <p>本工具仅供学习测试和技术交流使用，请勿用于任何非法用途。</p>
            <p>使用本工具所产生的一切后果由使用者自行承担，与开发者无关。</p>
        </div>
    </div>

    <script>
        const shortIdInput = document.getElementById('shortId');
        const suitIdSelect = document.getElementById('suitId');
        const fullIdDisplay = document.getElementById('fullId');
        const queryBtn = document.getElementById('queryBtn');
        const resultDiv = document.getElementById('result');

        // 处理输入号码
        function processID(input) {
            // 移除非数字字符
            input = input.replace(/\D/g, '');
            
            if (input.length === 6) {
                // 6位补0到18位
                return input.padEnd(18, '0');
            } else if (input.length === 18) {
                // 18位直接使用
                return input;
            }
            return input;
        }

        // 输入处理
        shortIdInput.addEventListener('input', function(e) {
            // 只允许数字
            let value = e.target.value.replace(/\D/g, '');
            e.target.value = value;
            
            // 更新预览
            if (value.length > 0) {
                const processed = processID(value);
                fullIdDisplay.textContent = processed;
                // 显示提示
                if (value.length === 6) {
                    fullIdDisplay.innerHTML = processed + ' <span style="color:#999;font-size:12px;">(自动补0)</span>';
                } else if (value.length === 18) {
                    fullIdDisplay.innerHTML = processed + ' <span style="color:#4caf50;font-size:12px;">(完整号码)</span>';
                } else {
                    fullIdDisplay.textContent = processed;
                }
            } else {
                fullIdDisplay.textContent = '-';
            }
        });

        // 查询函数
        async function query() {
            const shortId = shortIdInput.value.trim();
            
            if (shortId.length === 0) {
                showResult('error', '请输入6位地区码或18位身份证号');
                return;
            }
            
            if (shortId.length !== 6 && shortId.length !== 18) {
                showResult('error', '请输入6位地区码或完整的18位身份证号');
                return;
            }
            
            const fullId = processID(shortId);
            const suitId = suitIdSelect.value;
            
            // 显示加载状态
            queryBtn.disabled = true;
            showResult('loading', '<span class="spinner"></span>查询中，请稍候...');
            
            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idCard: fullId, suitId: suitId })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showResult('error', '查询失败：' + data.error);
                } else {
                    // 根据canApply显示结果
                    const statusClass = data.canApply ? 'success' : 'error';
                    const statusIcon = data.canApply ? '✓' : '✗';
                    let resultHTML = `<div style="font-size: 24px; margin-bottom: 15px;">${statusIcon} ${data.status}</div>`;
                    resultHTML += '<div style="font-size: 12px; color: #666; margin-top: 10px;">';
                    resultHTML += '<b>原始返回:</b><br>';
                    for (const [key, value] of Object.entries(data.raw || {})) {
                        resultHTML += `${key}: ${value}<br>`;
                    }
                    resultHTML += '</div>';
                    showResult(statusClass, resultHTML);
                }
            } catch (err) {
                showResult('error', '网络错误，请检查后端服务是否启动');
            } finally {
                queryBtn.disabled = false;
            }
        }

        // 去下卡
        function goApply() {
            const suitId = suitIdSelect.value;
            const url = `https://wap.gz.10086.cn/smphone/newSimcard/checkNumber.do?suit_type=117&simcard_suit_id=${suitId}`;
            window.open(url, '_blank');
        }

        // 显示结果
        function showResult(type, message) {
            resultDiv.className = 'result ' + type;
            resultDiv.innerHTML = message;
        }

        // 回车键触发查询
        shortIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                query();
            }
        });
    </script>
</body>
</html>
